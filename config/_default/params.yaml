hugoblox:
  schema: "2.0"

  identity:
    name: "João Adelino"
    organization: ""
    type: person
    tagline: "Water Resources Management · GIS · Remote Sensing · Field Technology"
    description: "Technical portfolio of João Adelino, focused on water resources management, watershed governance, GIS, remote sensing, UAVs, field monitoring, hydrogeology, and applied technology in Brazil's semi-arid region."
    social: {}

  theme:
    mode: dark
    pack: "default"
    colors:
      primary: "#4F9FC4"
      secondary: "#73B6D3"
      neutral: "zinc"
    colors_light: {}
    colors_dark: {}
    surfaces:
      background: "#0B0D10"
      foreground: "#E6EDF3"
      header:
        background: "#0B0D10"
        foreground: "#E6EDF3"
      footer:
        background: "#080A0C"
        foreground: "#9BA6B2"

  typography:
    pack: "academic"

  layout:
    radius: "md"
    spacing: "spacious"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: false
    theme_picker: false
    language_switcher: false
    cta:
      enable: false
      text: ""
      url: ""

  footer:
    style: minimal
    language_switcher: false
    text: "Water resources · geospatial intelligence · field technology"

  copyright:
    notice: "© {year} {name}. All rights reserved."
    license:
      type: custom
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

  seo:
    title: "João Adelino | Water Resources & Geospatial Technology"
    location:
      address:
        street: ""
        city: "Campina Grande"
        region: "Paraíba"
        postal_code: ""
        country: "Brazil"
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    ai:
      allow:
        - /
      disallow: []
      note: "Public professional portfolio."
      contact: ""

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa

  search:
    enable: false
    suggestions: []
    quick_actions: []

  comments:
    enable: false
    provider: ""
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  analytics:
    google:
      measurement_id: ""
    google_tag_manager:
      container_id: ""
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  repository:
    enable: false
    url: "https://github.com/adelinojoao/adelinojoao.github.io"
    branch: main
    content_dir: content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow
    permissions_policy: ""

  privacy:
    enable: false
    anonymize_analytics: true

  debug:
    enable: false
    hud:
      position: bottom-left
      opacity: 1.0
    export_logs: true

  pro:
    hide_attribution: false
    affiliate_code: ""
